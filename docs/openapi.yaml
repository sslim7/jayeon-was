            $ref: "#/components/schemas/Recipient"
        nextCursor:
          type: string
          nullable: true
    CreateSmsCampaign:
      type: object
      required:
        - requestId
        - title
        - message
        - recipientIds
      properties:
        attachmentIds:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            type: string
        requestId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        title:
          type: string
          minLength: 1
          maxLength: 100
        message:
          type: string
          minLength: 0
          maxLength: 2000
          description: 첨부가 없으면 공백뿐인 본문 거부. 앞뒤 공백과 개행은 보존.
        recipientIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
        reserved:
          type: boolean
          default: false
          description: 사용자가 「예약」으로 만든 문자면 true. 생략하면 false이며 이후 변경 API는 없다.
    SmsCampaign:
      type: object
      required:
        - id
        - title
        - message
        - status
        - recipientCount
        - readyCount
        - sendingCount
        - sentCount
        - failedCount
        - reserved
        - createdAt
        - updatedAt
        - startedAt
        - completedAt
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MessageAttachment'
        id:
          type: string
        title:
          type: string
          maxLength: 100
        message:
          type: string
          maxLength: 2000
        status:
          type: string
          enum:
            - READY
            - SENDING
            - COMPLETED
            - PARTIAL_FAILED
            - CANCELLED
        recipientCount:
          type: integer
          minimum: 0
        readyCount:
          type: integer
          minimum: 0
        sendingCount:
          type: integer
          minimum: 0
        sentCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        reserved:
          type: boolean
          description: 예약으로 만든 문자 표시. 필드가 없는 과거 문서는 false로 읽힌다.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
    SmsCampaignPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SmsCampaign"
        nextCursor:
          type: string
          nullable: true
    SmsCampaignRecipient:
      type: object
      required:
        - id
        - campaignId
        - recipientId
        - name
        - phone
        - message
        - status
        - attemptId
        - attemptCount
        - sentAt
        - failedAt
        - errorCode
        - errorMessage
        - createdAt
        - updatedAt
      properties:
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MessageAttachment'
        transport:
          type: string
          enum:
          - SMS
          - LMS
          - MMS
        id:
          type: string
        campaignId:
          type: string
        recipientId:
          type: string
        name:
          type: string
          maxLength: 100
        phone:
          type: string
        message:
          type: string
          maxLength: 2000
        status:
          type: string
          enum:
            - READY
            - SENDING
            - SENT
            - FAILED
        attemptId:
          type: string
        attemptCount:
          type: integer
          minimum: 0
        sentAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
        errorCode:
          type: string
          maxLength: 100
        errorMessage:
          type: string
          maxLength: 300
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SmsRecipientUpdate:
      type: object
      required:
        - status
        - attemptId
      properties:
        transport:
          type: string
          enum:
          - SMS
          - LMS
          - MMS
        status:
          type: string
          enum:
            - SENDING
            - SENT
            - FAILED
        attemptId:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        errorCode:
          type: string
          maxLength: 100
          description: FAILED 필수. OUTCOME_UNKNOWN/PARTIAL_SENT는 확인필요 및 재시도 금지.
        errorMessage:
          type: string
          maxLength: 300
    SmsDispatchResult:
      type: object
      required:
        - campaign
        - recipient
        - dispatchAllowed
      properties:
        campaign:
          $ref: "#/components/schemas/SmsCampaign"
        recipient:
          $ref: "#/components/schemas/SmsCampaignRecipient"
        dispatchAllowed:
          type: boolean
          description: 최초 READY→SENDING 트랜잭션 승자만 true. false면 SMS를 호출하지 않는다.
    TokenSet:
      type: object
      required: [accessToken, refreshToken, expiresInSec]
      properties:
        accessToken: { type: string, description: '15분 유효한 액세스 토큰. 세션 id 를 클레임으로 싣지만 **서버는 세션을 검증하지 않는다**' }
        refreshToken: { type: string, description: '90일 유효한 리프레시 토큰. 재발급 시 세션이 살아 있는지 대조한다' }
        expiresInSec: { type: integer, example: 900, description: '액세스 토큰 수명(초). 🔴 이 값이 곧 「기기 끊기」가 실제로 듣기까지의 최대 시간이다' }
    SessionAccess:
      type: object
      required: [at, deviceLabel]
      properties:
        at: { $ref: '#/components/schemas/Timestamp' }
        deviceLabel: { type: string, description: 그때의 기기 표시. ⚠️ 추정값이다 }
    UserSession:
      type: object
      required: [sessionId, deviceLabel, userAgent, createdAt, lastSeenAt, current, revokedAt, accessibleUntilAtMost, recentAccesses]
      properties:
        sessionId: { type: string }
        deviceLabel:
          type: string
          description: >-
            ⚠️ **User-Agent 로 추정한 값이라 정확하지 않다.** 「Chrome · macOS」,
            「네이처 앱 1.4.0 · 안드로이드」 정도가 한계이고 모델명은 대개 알 수 없다.
            알 수 없으면 「알 수 없는 기기」다. 단정적인 문구로 감싸지 마라.
        userAgent:
          type: string
          description: 추정의 근거가 된 원문(최대 512바이트로 잘릴 수 있다). 추정이 빗나갔을 때 사람이 직접 읽으라고 둔다
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        lastSeenAt:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: >-
            ⚠️ **날짜 단위로만 정확하다.** 재발급마다 쓰지 않고 한국 날짜가 바뀌거나 기기
            표시가 달라졌을 때만 기록하므로, 같은 날 안에서는 그날 처음 기록한 시각에 머문다.
            🔴 이 값으로 「언제까지 쓸 수 있는가」를 계산하지 마라 — accessibleUntilAtMost 가 있다.
        current:
          type: boolean
          description: 지금 이 요청을 보낸 기기인가. 액세스 토큰에 실린 세션 id 로 가린다
        revokedAt:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          nullable: true
          description: 끊은 시각. 살아 있으면 null
        accessibleUntilAtMost:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          nullable: true
          description: >-
            끊긴 기기가 **늦어도 언제까지** 앱을 쓸 수 있는지. 살아 있는 세션이면 null 이다
            (끊기 전에는 한계가 없다). ⚠️ 이름 그대로 **상한**이지 정확한 시각이 아니다 —
            `revokedAt + 액세스 토큰 수명(15분)` 이며, 그 기기가 마지막으로 재발급한 것이
            한참 전이면 실제로는 더 일찍 끊긴다.
        recentAccesses:
          type: array
          maxItems: 10
          description: 최근 접속 기록. 최신이 앞이다. 하루 한두 번만 기록하므로 사실상 「최근 열흘 중 쓴 날」이다
          items: { $ref: '#/components/schemas/SessionAccess' }
    RevokeSessionResult:
      type: object
      required: [sessionId, revokedAt, accessibleUntilAtMost, current]
      properties:
        sessionId: { type: string }
        revokedAt: { $ref: '#/components/schemas/Timestamp' }
        accessibleUntilAtMost:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: >-
            🔴 앱은 이 값으로 「이 기기는 00:49까지 쓸 수 있어요」라고 안내해야 한다.
            ⚠️ 상한이지 정확한 시각이 아니다(UserSession 의 같은 필드 설명 참고).
        current:
          type: boolean
          description: 지금 이 기기를 끊었는가. true 면 앱은 저장된 토큰을 버리고 로그인 화면으로 가야 한다
    UserProfile:
      type: object
      required: [userId, email, userName, mustChangePassword, createdAt]
      properties:
        userId: { type: string }
        email: { type: string, format: email }
        userName: { type: string }
        mustChangePassword: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
    # ---------- 공통 ----------
    # 이 스키마는 Go 의 httpx.Error 와 **1:1 대응한다**(internal/httpx/httpx.go).
    # 필드 이름이나 형태가 한쪽만 바뀌면 SPA 가 에러 본문을 못 읽어 모든 실패가
    # 「알 수 없는 오류」로 뭉개진다 — 고칠 때는 두 곳을 같이 고쳐라.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            기계 판독용 에러 코드. 클라이언트는 이 값으로 분기하고 `message` 는 그대로 표시한다.
            공통 코드는 `VALIDATION_FAILED` · `UNAUTHORIZED` · `INTERNAL_ERROR` 이며,
            사용자 인증은 `INVALID_CREDENTIALS` · `ACCOUNT_DISABLED`를 더한다.
            `TOO_MANY_ATTEMPTS`는 향후 시도 제한용 429 예약 코드다. 현재 제한은 구현하지 않았으며,
            구현 시 `details`에 남은 초를 담는다.
          example: VALIDATION_FAILED
        message:
          type: string
          description: 사용자에게 그대로 보여줄 수 있는 한국어 문구
          example: 요청 값이 올바르지 않아요
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: 필드별 위반 내역 등 부가 정보

    Timestamp:
      type: string
      format: date-time
      description: RFC 3339. 서버가 `ServerTimestamp` 로 기록한 값
