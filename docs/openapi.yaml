openapi: 3.0.3

info:
  title: Nature API
  version: 0.1.0
  description: |
    Nature 백엔드 API.

    ## 이 문서의 위치

    이 파일은 `//go:embed docs/openapi.yaml` 로 바이너리에 박혀 `GET /openapi.yaml` 로
    그대로 나가고, `GET /docs` 의 Swagger UI 가 이것을 읽는다. **파일이 없으면 빌드가 깨진다.**

    사용자 인증은 초대 전용 이메일·비밀번호 방식이다. 어드민 경로는 스텁이며, 요청·응답 스키마의
    정본은 `internal/admin` 의 핸들러다 — 여기에 상세를 지어 넣으면 구현과 어긋난다.

servers:
  - url: https://nature-api.redhead.kr
    description: 운영
  - url: http://localhost:8091
    description: 로컬 개발 (Firestore 에뮬레이터 연동)

security:
  - bearerAuth: []

paths:
  /calls:
    get:
      tags: [calls]
      operationId: listCallAnalyses
      summary: 이름 또는 전화번호 뒷자리로 검색하는 통화 목록
      description: >-
        사용자 소유 통화만 통화일시(recorded_at) 내림차순, 같은 시각이면 통화 ID 내림차순으로 반환한다.
        목록 항목에는 transcript 와 analysis 가 없고 160자 한 줄 요약만 들어 있다.


        `q` 는 **이름 부분일치(대소문자 무시) 또는 전화번호 부분일치(뒷자리 포함)** 다.
        하이픈·공백·괄호·`+82` 표기 차이는 양쪽 모두 걷어 내고 숫자만 비교한다.
        글자와 숫자가 섞이면 글자는 이름, 숫자는 번호를 가리킨다(`김영 7649`).
        규칙은 앱의 `src/lib/recipient-search.ts` 와 같고 서버는 `internal/recipients/search.go` 한 곳에 둔다.


        🔴 **검색 중에는 items 가 limit 보다 적어도 마지막 페이지가 아니다.**
        Firestore 는 부분 문자열 검색을 인덱스로 못 하므로 서버가 최신순으로 문서를 읽어 메모리에서 거르고,
        한 요청이 훑는 문서 수에 상한(300건)을 둔다. 상한에 걸리면 **찾은 만큼만 돌려주고 nextCursor 를 남긴다**.
        따라서 클라이언트는 `nextCursor` 가 사라질 때까지(또는 화면이 찰 때까지) 이어 불러야 한다.
        `nextCursor` 가 없을 때만 마지막 페이지다.


        커서는 **검색어에 귀속된다.** `q` 를 바꾸면서 이전 커서를 그대로 보내면 400 이다(커서를 버리고 처음부터 다시 부른다).
      parameters:
        - {in: query, name: q, description: '이름 또는 전화번호 뒷자리. 없거나 비어 있으면 전체.', schema: {type: string, maxLength: 100}}
        - {in: query, name: limit, description: '페이지 크기. 서버가 1~100 으로 제한한다.', schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
        - {in: query, name: cursor, description: 이전 응답의 nextCursor 를 그대로 보낸다, schema: {type: string, maxLength: 2048}}
      responses:
        '200':
          description: 통화 목록 (페이지당 최대 limit 건)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/CallSummary'}}
                  nextCursor: {type: string, description: '없으면 마지막 페이지. 검색 중에는 items 가 limit 보다 적어도 남을 수 있다(스캔 상한).'}
        '400': {description: '커서·limit·검색어 형식 오류'}
        '401': {description: 인증 필요}
        '403': {description: 비활성 또는 비밀번호 변경 필요 계정}
  /calls/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$'}}
    get:
      tags: [calls]
      operationId: getCallAnalysis
      summary: 저장된 통화 분석과 원문 조회
      responses:
        '200':
          description: 전체 통화 분석 (추론 재실행 없음)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallDetail'}
        '401': {description: 인증 필요}
        '404': {description: 본인 소유 통화 없음}
    put:
      tags: [calls]
      operationId: saveCallAnalysis
      summary: 기기에서 완료한 통화 분석 저장
      description: >-
        요청 본문 최대 6 MiB. transcript, analysis, ai 필수. 같은 ID 와 정규화된 동일 결과 재전송은 멱등이고
        다른 결과는 409 다. 서버가 status 를 COMPLETED 로 확정한다. 원본 음성은 수신하지 않는다.
        recorded_at 은 서버 시각 기준 5분 뒤까지만 허용한다(기기 시계 오차 여유).
        processed_on_device=true 필수.
        **응답은 목록용 요약(CallSummary)이며 보낸 transcript/analysis 를 되돌려주지 않는다** —
        요청 본문을 한 벌 더 직렬화하지 않기 위해서다. 원본은 클라이언트가 이미 갖고 있다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CallInput'}
      responses:
        '200':
          description: 저장 완료 (요약만 반환)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallSummary'}
        '400': {description: 형식 또는 값 검증 실패. 같은 본문을 다시 보내도 결과는 같다}
        '401': {description: 인증 필요}
        '409': {description: 동일 ID 에 다른 결과 존재}
        '413': {description: '요청 본문 또는 저장 바이트가 한도를 넘음(CALL_TOO_LARGE). 재시도해도 소용없다'}
  /calls/{id}/audio/upload-url:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$'}}
    post:
      tags: [calls]
      operationId: createCallAudioUploadURL
      summary: 녹음 파일 업로드용 서명 URL 발급
      description: >-
        서버 통화분석 경로의 첫 단계다. 작업 문서를 AWAITING_UPLOAD 로 만들고 GCS V4 서명 PUT URL 을 돌려준다.
        **서버는 오디오 바이트를 통과시키지 않는다** — 앱이 이 URL 로 GCS 에 직접 올린다.


        🔴 **PUT 할 때 응답의 headers["Content-Type"] 을 글자 그대로 똑같이 보내야 한다.**
        Content-Type 이 서명에 들어가므로 다르면 GCS 가 403 SignatureDoesNotMatch 를 돌려주는데
        응답만 봐서는 원인이 전혀 드러나지 않는다.


        객체 경로는 결정적이다(`calls/{uid}/{callId}/audio{ext}`). complete 전이라면 몇 번이든 다시 불러도
        같은 경로에 새 URL 이 발급된다 — 재시도마다 고아 객체가 생기지 않게 하기 위해서다.
        진행률과 취소는 단순 PUT 으로 가능하다(XMLHttpRequest.upload.onprogress / xhr.abort).
        resumable 업로드는 지원하지 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CallAudioUploadRequest'}
      responses:
        '200':
          description: 서명 URL
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallAudioUploadURL'}
        '400': {description: 형식/크기/연락처 검증 실패}
        '401': {description: 인증 필요}
        '404': {description: 다른 사용자의 통화 ID (존재 사실을 알려주지 않는다)}
        '409': {description: '이미 분석이 시작된 통화(CALL_ALREADY_QUEUED). 오디오를 갈아 끼우면 전사문과 원본이 어긋난다'}
        '500': {description: '서명 실패. 운영에서는 대개 iam.serviceAccounts.signBlob 권한 문제이며 원인은 서버 로그에만 남는다'}
  /calls/{id}/audio/complete:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$'}}
    post:
      tags: [calls]
      operationId: completeCallAudioUpload
      summary: 업로드 완료 통보 및 분석 큐잉
      description: >-
        GCS 객체의 존재와 크기를 확인하고 작업을 QUEUED 로 바꾼다.
        이때 **플레이스홀더 통화 레코드가 생겨** 이후 진행 상태가 기존 GET /calls, GET /calls/{id} 로 그대로 보인다.
        본문은 없거나 빈 객체다. 이미 큐잉된 통화에 다시 불러도 200 과 현재 상태를 돌려준다(앱 재시도 대비).
      responses:
        '200':
          description: 현재 작업 상태(요약 레코드)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallSummary'}
        '400': {description: '업로드가 끝나지 않았거나 크기가 비정상(CALL_AUDIO_MISSING)'}
        '401': {description: 인증 필요}
        '404': {description: 본인 소유 작업 없음}
        '409': {description: 'upload-url 을 먼저 받지 않았다(CALL_NO_AUDIO)'}
  /calls/{id}/reanalyze:
    parameters:
      - {in: path, name: id, required: true, schema: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$'}}
    post:
      tags: [calls]
      operationId: reanalyzeCall
      summary: 전사문을 그대로 두고 분석만 다시 실행
      description: >-
        **오디오를 다시 전사하지 않는다** — ASR 이 가장 비싼 단계이고 재분석이 필요한 이유는 대개 프롬프트 변경이나 LLM 실패다.
        따라서 보관 기간(366일)이 지나 원본 오디오가 사라진 뒤에도 동작한다.
        작업이 COMPLETED / ANALYSIS_FAILED / TRANSCRIBED 이고 전사문이 있어야 한다. 본문은 없다.
      responses:
        '200':
          description: 재분석 예약됨(요약 레코드)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallSummary'}
        '401': {description: 인증 필요}
        '404': {description: 본인 소유 작업 없음}
        '409': {description: '분석 가능한 상태가 아니거나(CALL_NOT_ANALYZABLE) 다시 분석할 원문이 없다(CALL_NO_TRANSCRIPT)'}
  /internal/calls/tick:
    post:
      tags: [calls]
      operationId: runCallPipelineTick
      summary: 통화분석 파이프라인 구동 (Cloud Scheduler 전용)
      description: >-
        🔴 **앱이 부르는 API 가 아니다.** Cloud Scheduler 가 1분마다 OIDC 토큰으로 호출한다.
        Cloud Run 이 allow_unauthenticated 라 **이 핸들러가 유일한 방어선**이며, 검증 항목은 네 개다:
        ①구글 서명 ②aud 일치(Cloud Run 서비스 URL, 경로 없음) ③email 이 CALL_TICK_CALLER 와 일치 ④email_verified == true.
        실패 이유는 응답에 적지 않는다.


        한 요청이 50초 예산 안에서 작업을 여러 단계 전진시키고, 못 끝낸 것은 상태로 저장해 다음 tick 에 넘긴다.
        **응답 후 도는 백그라운드 작업은 없다**(Cloud Run cpu_idle=true 라 응답 직후 CPU 가 스로틀된다).
        응답에는 개수와 남은 예산만 들어가며 통화 내용은 한 글자도 담기지 않는다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 이번 tick 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CallTickResult'}
        '401': {description: 허용되지 않은 호출자}
  /recipients/{id}/external-sends:
    post:
      tags: [recipients]
      operationId: registerExternalSend
      summary: 실제 전송 없이 외부 발송일시 1건 등록
      description: 사용자별 requestId 멱등 처리. 미래 일시 거부. 수신자 집계와 EXTERNAL 이력을 원자적으로 저장한다.
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, sentAt]
              properties:
                requestId: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$'}
                sentAt: {type: string, format: date-time}
      responses:
        '201':
          description: 외부 발송 등록
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalSendResult'}
        '200':
          description: 동일 요청의 기존 결과
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExternalSendResult'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 소유 수신자 없음
        '409':
          description: IDEMPOTENCY_CONFLICT 같은 요청 ID의 내용 변경
  /sms/history:
    get:
      tags: [messaging]
      operationId: listSmsHistory
      summary: 수신자 이름 또는 전화번호 뒷자리로 검색하는 전체 발송이력
      description: >-
        SENT·FAILED 완료 시도와 현재 SENDING 시도. 발송시각 내림차순 후 고유 ID 내림차순. READY 제외.
        사용자 및 검색어에 귀속된 커서.
        `q` 는 GET /calls 와 **같은 규칙**이다 — 이름 부분일치(대소문자 무시) 또는 전화번호 부분일치(뒷자리 포함),
        하이픈·공백·괄호·`+82` 표기 차이는 숫자만 남겨 비교한다.
      parameters:
        - in: query
          name: q
          description: '이름 또는 전화번호 뒷자리. 없거나 비어 있으면 전체.'
          schema: {type: string, maxLength: 100}
        - in: query
          name: limit
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - in: query
          name: cursor
          schema: {type: string}
      responses:
        '200':
          description: 최신 발송순 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/RecipientHistory'}
                  nextCursor: {type: string, nullable: true}
                  total: {type: integer}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /sms/attachments:
    post:
      tags:
      - messaging
      summary: JPEG/PNG 업로드 개별300KiB
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAttachment'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageUpload'
  /sms/attachments/{id}:
    get:
      tags:
      - messaging
      summary: 첨부 메타데이터
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAttachment'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    delete:
      tags:
      - messaging
      summary: 첨부 논리삭제 기존 스냅샷 유지
      responses:
        '204':
          description: 성공
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
  /sms/attachments/{id}/content:
    get:
      tags:
      - messaging
      summary: 첨부 원본 JSON
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/MessageAttachment'
                - type: object
                  properties:
                    dataBase64:
                      type: string
                      format: byte
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
  /sms/templates:
    get:
      tags:
      - messaging
      summary: 템플릿 목록
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessageTemplate'
                  nextCursor:
                    type: string
                    nullable: true
    post:
      tags:
      - messaging
      summary: 템플릿 등록 최대3개 총600KiB
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageTemplateInput'
  /sms/templates/{id}:
    get:
      tags:
      - messaging
      summary: 템플릿 조회
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplate'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    put:
      tags:
      - messaging
      summary: 템플릿 수정
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageTemplate'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageTemplateInput'
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    delete:
      tags:
      - messaging
      summary: 템플릿 삭제
      responses:
        '204':
          description: 성공
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
  /recipients/{id}/history:
    get:
      tags:
      - messaging
      summary: 수신자 발송이력 최신순
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
