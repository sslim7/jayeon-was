            type: object
            required: [name, value]
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 100
              value:
                type: string
                maxLength: 1000
        latestSentAt:
          type: string
          format: date-time
          nullable: true
        id:
          type: string
        name:
          type: string
          maxLength: 100
        phone:
          type: string
          example: "01012345678"
        groupId:
          type: string
          maxLength: 100
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RecipientPage:
      type: object
      required:
