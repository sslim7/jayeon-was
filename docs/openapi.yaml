          description: 첨부가 없으면 공백뿐인 본문 거부. 앞뒤 공백과 개행은 보존.
        recipientIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
        reserved:
          type: boolean
          default: false
          description: 사용자가 「예약」으로 만든 문자면 true. 생략하면 false이며 이후 변경 API는 없다.
    SmsCampaign:
