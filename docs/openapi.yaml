        리프레시 토큰의 버전과 계정의 현재 버전을 대조한다.
        비밀번호 변경 이전에 발급한 리프레시 토큰은 401로 거절한다.
        재발급 자체가 이전 리프레시 토큰을 폐기하지는 않는다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: 새 토큰 세트 (mustChangePassword 필드는 없음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/change-password:
    post:
      tags: [auth]
      summary: 사용자 비밀번호 변경
      operationId: changeUserPassword
      description: |
        새 비밀번호는 8자 이상, UTF-8 기준 72바이트 이하여야 하며 현재 비밀번호와 달라야 한다.
        해시 교체, 토큰 버전 증가, mustChangePassword 해제를 함께 저장한다.
        기존 리프레시 토큰은 무효가 되므로 변경 후 다시 로그인한다.
        이미 발급한 액세스 토큰은 최대 1시간 더 유효하다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8 }
      responses:
        '204': { description: 변경 완료 (본문 없음) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: UNAUTHORIZED (미인증) 또는 INVALID_CREDENTIALS (현재 비밀번호 불일치)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '500': { $ref: '#/components/responses/InternalError' }

  /users/me:
    get:
      tags: [users]
      summary: 로그인한 사용자 프로필
      operationId: getCurrentUser
      responses:
        '200':
          description: 비밀번호 변경 필요 여부의 정본
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/AccountDisabled' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ──────────────────────────────────────────────────────────────
  # 어드민 — 스텁. 정본은 internal/admin 이다.
  # ──────────────────────────────────────────────────────────────
  /auth/admin.login:
    post:
      tags: [admin]
      security: []
      summary: 어드민 로그인
      description: 구현은 internal/admin 참고.
      operationId: adminLogin
      responses:
        '200':
          description: 어드민 토큰 세트
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/admin.change-password:
    post:
      tags: [admin]
      summary: 어드민 비밀번호 변경
      description: 구현은 internal/admin 참고.
      operationId: adminChangePassword
      responses:
        '200':
          description: 변경 완료
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/admins:
    get:
      tags: [admin]
      summary: 어드민 계정 목록
      description: 구현은 internal/admin 참고.
      operationId: listAdmins
      responses:
        '200':
          description: 목록
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    post:
      tags: [admin]
      summary: 어드민 계정 생성
      description: 구현은 internal/admin 참고.
      operationId: createAdmin
      responses:
        '200':
          description: 생성된 계정
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/admins/{adminId}:
    parameters:
      - name: adminId
        in: path
        required: true
        description: 어드민 계정 문서 ID
        schema: { type: string, minLength: 1 }
    patch:
      tags: [admin]
      summary: 어드민 계정 수정
      description: 구현은 internal/admin 참고.
      operationId: updateAdmin
      responses:
        '200':
          description: 수정된 계정
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /admin/audit-logs:
    get:
      tags: [admin]
      summary: 감사 로그 조회
      description: 구현은 internal/admin 참고.
      operationId: listAuditLogs
      responses:
        '200':
          description: 감사 로그 목록
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

tags:
  - name: recipients
    description: 사용자별 수신자 관리
  - name: sms
    description: Android SIM 발송 캠페인과 앱 보고 결과. 서버는 SMS를 발송하지 않는다.
  - name: auth
    description: 초대 전용 사용자 인증. 공개 가입과 비밀번호 찾기 API는 제공하지 않는다.
  - name: users
    description: 사용자 프로필
  - name: admin
    description: 어드민 인증과 계정·감사 로그. `ADMIN_JWT_SECRET` 이 없으면 라우트가 아예 걸리지 않는다

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        액세스 토큰(Bearer). 사용자 토큰과 어드민 토큰은 **서로 다른 시크릿으로 서명한다** —
        `ADMIN_JWT_SECRET` 이 `JWT_SECRET` 과 같으면 어드민 토큰이 사용자 미들웨어에서도
        파싱되므로 서버가 기동을 거부한다.

  responses:
    InvalidCredentials:
      description: 이메일 또는 비밀번호 불일치
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: INVALID_CREDENTIALS, message: 이메일 또는 비밀번호가 맞지 않아요 }
    AccountDisabled:
      description: 비활성 계정
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: ACCOUNT_DISABLED, message: 사용할 수 없는 계정이에요 }
    BadRequest:
      description: 요청 형식 또는 값 검증 실패
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: VALIDATION_FAILED, message: 요청 값이 올바르지 않아요 }
    Unauthorized:
      description: 토큰이 없거나 유효하지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: UNAUTHORIZED, message: 로그인이 필요해요 }
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: INTERNAL_ERROR, message: 서버 오류가 생겼어요 }

  schemas:
    CallContact:
      type: object
      required: [name, phone]
      properties:
        name: {type: string, minLength: 1, maxLength: 100, description: 최대 100자(rune 기준)}
        phone: {type: string, pattern: '^\+?[0-9]{7,15}$'}
        recipient_id: {type: string, nullable: true, pattern: '^[a-zA-Z0-9_-]{1,128}$'}
    CallMeta:
      type: object
      required: [file_name, duration, recorded_at]
      properties:
        file_name: {type: string, minLength: 1, maxLength: 1024}
        duration: {type: number, nullable: true, minimum: 0, maximum: 86400}
        recorded_at: {type: string, format: date-time, description: RFC3339. 서버 시각 +5분까지 허용하고 UTC 로 정규화한다}
    CallTranscript:
      type: object
      required: [text, segments]
      properties:
        text: {type: string, description: 최대 UTF-8 4 MiB}
        segments:
          type: array
          maxItems: 20000
          items:
            type: object
            required: [start, end, text]
            properties:
              start: {type: number, minimum: 0}
              end: {type: number, minimum: 0, maximum: 86400}
              text: {type: string, minLength: 1, maxLength: 64000}
              speaker: {type: string, maxLength: 100}
    CallAI:
      type: object
      required: [model, model_version, processed_on_device]
      properties:
        model: {type: string, minLength: 1, maxLength: 200}
        model_version: {type: string, minLength: 1, maxLength: 200}
        processed_on_device: {type: boolean, description: '기기 업로드 경로는 true(CallInput 에서는 필수). 서버 파이프라인이 만든 레코드는 false 다'}
        provider: {type: string, maxLength: 200, description: '**응답 전용.** 서버 파이프라인이 쓴 공급자 이름. 요청에 넣으면 400'}
    CallAnalysis:
      type: object
      description: 저장되는 JSON 합계 최대 400000 bytes. 배열은 비어도 생략하지 않는다.
      required: [schema_version, summary, details, todos, decisions, consulting]
      properties:
        schema_version: {type: integer, enum: [1]}
        summary: {type: string, minLength: 1, maxLength: 32000}
        details:
          type: array
          maxItems: 200
          items:
            type: object
            required: [title, content]
            properties:
              title: {type: string, minLength: 1, maxLength: 1000}
              content: {type: string, minLength: 1, maxLength: 32000}
        todos:
          type: array
          maxItems: 100
          items:
            type: object
            required: [content, owner, due_date, source]
            properties:
              content: {type: string, minLength: 1, maxLength: 8000}
              owner: {type: string, nullable: true, maxLength: 400}
              due_date: {type: string, format: date, nullable: true}
              source: {type: string, minLength: 1, maxLength: 8000}
        decisions: {type: array, maxItems: 200, items: {type: string, minLength: 1, maxLength: 16000}}
        consulting:
          type: object
          required: [customer_needs, questions, concerns, objections, important_points, followups]
          properties:
            customer_needs: {type: array, maxItems: 200, items: {type: string, minLength: 1, maxLength: 16000}}
            questions: {type: array, maxItems: 200, items: {type: string, minLength: 1, maxLength: 16000}}
            concerns: {type: array, maxItems: 200, items: {type: string, minLength: 1, maxLength: 16000}}
            objections: {type: array, maxItems: 200, items: {type: string, minLength: 1, maxLength: 16000}}
            important_points: {type: array, maxItems: 200, items: {type: string, minLength: 1, maxLength: 16000}}
            followups: {type: array, maxItems: 200, items: {type: string, minLength: 1, maxLength: 16000}}
    CallInput:
      type: object
      description: >-
        PUT /calls/{id} 요청 본문. 명세에 없는 필드는 거부한다(서버가 unknown field 를 400 으로 막는다).
        status/progress/error/summary 는 받아도 서버가 덮어쓴다 — status 는 COMPLETED, 나머지는 비운다.


        🔴 **이 스키마는 동결이다.** 서버 파이프라인이 응답에 붙이는 필드
        (job_state, stage, has_audio, audio_url, ai.provider)를 **요청에 넣으면 400 이다** —
        구버전 앱 계약을 넓히지 않기 위해 서버가 명시적으로 거부한다. 응답에서 읽기만 하라.
      required: [call_id, contact, call, created_at, transcript, analysis, ai]
      additionalProperties: false
      properties:
        call_id: {type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$', description: 경로의 id 와 같아야 한다}
        contact: {$ref: '#/components/schemas/CallContact'}
        call: {$ref: '#/components/schemas/CallMeta'}
        created_at: {type: string, format: date-time}
        status: {type: string, description: 서버가 COMPLETED 로 덮어쓴다}
        progress: {type: number, nullable: true, description: 서버가 비운다}
        summary: {type: string, description: 서버가 비운다}
        error: {type: string, nullable: true, description: 서버가 비운다}
        transcript: {$ref: '#/components/schemas/CallTranscript'}
        analysis: {$ref: '#/components/schemas/CallAnalysis'}
        ai: {$ref: '#/components/schemas/CallAI'}
    CallStatus:
      type: string
      description: >-
        🔴 **닫힌 집합이다.** 앱이 이 값으로 진행 단계를 계산하므로 서버는 여기 없는 값을 내보내지 않는다.
        서버 파이프라인의 내부 상태는 job_state 로 따로 나가며, status 는 아래처럼 사상된다:
        AWAITING_UPLOAD→PENDING, QUEUED→PREPARING, ASR_RUNNING/ASR_POLLING→TRANSCRIBING,
        TRANSCRIBED/ANALYZING→ANALYZING, COMPLETED→COMPLETED, TRANSCRIPTION_FAILED→TRANSCRIPTION_FAILED,
        ANALYSIS_FAILED→ANALYSIS_FAILED.
        기기 업로드 경로(PUT)로 저장된 레코드는 항상 COMPLETED 다.
        UPLOADING/UPLOAD_FAILED/UPLOAD_REJECTED/PENDING/FAILED 는 기기 경로 전용 값이다.
      enum: [PENDING, PREPARING, TRANSCRIBING, ANALYZING, UPLOADING, COMPLETED, FAILED, TRANSCRIPTION_FAILED, ANALYSIS_FAILED, UPLOAD_FAILED, UPLOAD_REJECTED]
    CallJobState:
      type: string
      description: '**응답 전용.** 서버 파이프라인 내부 상태 원문. 기기 경로 레코드에는 붙지 않는다.'
      enum: [AWAITING_UPLOAD, QUEUED, ASR_RUNNING, ASR_POLLING, TRANSCRIBED, ANALYZING, COMPLETED, TRANSCRIPTION_FAILED, ANALYSIS_FAILED]
    CallSummary:
      type: object
      description: >-
        목록 항목과 PUT/audio/reanalyze 응답. transcript/analysis 를 담지 않는다.
        🔴 audio_url 은 여기 **없다** — 30건마다 서명 URL 30개를 만드는 것은 불필요한 비용이고
        목록 화면은 재생 버튼을 쓰지 않는다. 목록에서는 has_audio 만 본다.
      required: [call_id, contact, call, created_at, status, progress]
      properties:
        call_id: {type: string}
        contact: {$ref: '#/components/schemas/CallContact'}
        call: {$ref: '#/components/schemas/CallMeta'}
        created_at: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/CallStatus'}
        progress: {type: number, nullable: true, minimum: 0, maximum: 1}
        summary: {type: string, description: analysis.summary 를 공백 정규화한 160자 한 줄 요약}
        error: {type: string, nullable: true, description: 실패 코드(공급자 코드 또는 분류 이름)}
        job_state: {$ref: '#/components/schemas/CallJobState'}
        stage: {type: string, maxLength: 60, description: '**응답 전용.** 사용자에게 그대로 보여 줄 한국어 단계명(예: 받아쓰는 중)'}
        has_audio: {type: boolean, description: '**응답 전용.** GCS 에 원본 오디오가 있는지. false 는 실패가 아니다(기기 경로 통화이거나 보관 기간이 지난 통화)'}
        ai: {$ref: '#/components/schemas/CallAI'}
    CallDetail:
      type: object
      description: GET /calls/{id} 응답. 원문과 구조화 할 일까지 모두 담는다.
      required: [call_id, contact, call, created_at, status, progress]
      properties:
        call_id: {type: string}
        contact: {$ref: '#/components/schemas/CallContact'}
        call: {$ref: '#/components/schemas/CallMeta'}
        created_at: {type: string, format: date-time}
        status: {$ref: '#/components/schemas/CallStatus'}
        progress: {type: number, nullable: true, minimum: 0, maximum: 1}
        error: {type: string, nullable: true}
        job_state: {$ref: '#/components/schemas/CallJobState'}
        stage: {type: string, maxLength: 60, description: '**응답 전용.** 한국어 단계명'}
        has_audio: {type: boolean, description: '**응답 전용.** GCS 에 원본 오디오가 있는지'}
        audio_url:
          type: string
          nullable: true
          description: >-
            **응답 전용, 상세에만 붙는다.** 녹음 재생용 V4 서명 GET URL 이며 **15분 뒤 만료된다.**
            🔴 저장되지 않고 조회할 때마다 새로 발급된다 — 만료되는 값을 저장하면 굳은 URL 이 남는다.
            값이 없는 경우는 둘 다 정상이다: ①기기 업로드 경로로 저장된 통화 ②보관 기간(366일)이 지나 원본이 삭제된 통화.
            🔴 **보관 만료는 분석 실패가 아니다** — status 는 COMPLETED 그대로이고 audio_url 만 없다.
        transcript:
          allOf: [{$ref: '#/components/schemas/CallTranscript'}]
          nullable: true
          description: 아직 전사가 끝나지 않은 통화에서는 없다(오류가 아니다)
        analysis:
          allOf: [{$ref: '#/components/schemas/CallAnalysis'}]
          nullable: true
          description: 아직 분석이 끝나지 않은 통화에서는 없다(오류가 아니다)
        ai: {$ref: '#/components/schemas/CallAI'}
    CallAudioUploadRequest:
      type: object
      required: [content_type, size, contact, call]
      properties:
        content_type:
          type: string
          description: 🔴 이 값을 PUT 의 Content-Type 헤더로 **글자 그대로** 다시 보내야 서명이 맞는다
          enum: [audio/m4a, audio/mp4, audio/aac, audio/mpeg, audio/wav, audio/x-wav, audio/ogg, audio/webm, audio/amr, audio/3gpp]
        size: {type: integer, minimum: 1, maximum: 104857600, description: 예상 바이트 수(최대 100 MiB)}
        contact: {$ref: '#/components/schemas/CallContact'}
        call: {$ref: '#/components/schemas/CallMeta'}
    CallAudioUploadURL:
      type: object
      required: [call_id, method, url, headers, object, expires_at, max_bytes]
      properties:
        call_id: {type: string}
        method: {type: string, enum: [PUT]}
        url: {type: string, format: uri, description: GCS V4 서명 URL}
        headers:
          type: object
          description: 🔴 **PUT 요청에 이 헤더를 그대로 실어야 한다.** 다르면 GCS 가 403 SignatureDoesNotMatch 를 돌려준다
          additionalProperties: {type: string}
        object: {type: string, description: '결정적 객체 경로(calls/{uid}/{callId}/audio{ext}). 재시도는 같은 경로를 덮어쓴다'}
        expires_at: {type: string, format: date-time, description: 서명 만료(발급 시각 +60분)}
        max_bytes: {type: integer, description: 업로드 상한}
        retention_days: {type: integer, description: '원본 오디오 보관 일수. 삭제는 GCS 수명주기 정책이 한다'}
    CallTickResult:
      type: object
      required: [claimed, advanced, failed, remaining_budget_ms]
      properties:
        claimed: {type: integer, description: 이번 tick 이 lease 를 건 작업 수}
        advanced: {type: integer, description: 한 단계 이상 전진한 작업 수}
        failed: {type: integer, description: 이번 tick 에서 확정 실패한 작업 수}
        remaining_budget_ms: {type: integer, description: 남은 예산(ms)}
    ExternalSendResult:
      type: object
      required: [recipient, history]
      properties:
        recipient: {$ref: '#/components/schemas/Recipient'}
